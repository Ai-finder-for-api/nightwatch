name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: Rustfmt and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build-and-test:
    name: ${{ matrix.os }} / stable
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Show toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Build release CLI
        run: cargo build --locked --release --bin nightwatch
      - name: Test all targets
        run: cargo test --locked --all-targets
      - name: Smoke test CLI on synthetic PCAP fixture
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/release/nightwatch
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" info
          "$BIN" analyze fixtures/sample_attacks.pcap --db ci.db --json ci_findings.json
          "$BIN" report --db ci.db --out ci_report.json
          test -s ci_findings.json
          test -s ci_report.json
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: nightwatch-${{ matrix.os }}
          path: |
            target/release/nightwatch
            target/release/nightwatch.exe
          if-no-files-found: ignore

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: Check with minimum supported Rust
        run: cargo check --locked --all-targets

  crate-package:
    name: crates.io package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: List packaged files
        run: cargo package --locked --list
      - name: Build and verify package tarball
        run: cargo package --locked
      - name: Publish dry run
        run: cargo publish --dry-run --locked
