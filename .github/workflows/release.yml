name: Release

# Push a tag like v0.1.0 that matches Cargo.toml to publish to crates.io.
# Requires repository secret CARGO_REGISTRY_TOKEN in the crates-io environment.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Verify, publish and create release
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag" ]]; then
            echo "::error::tag v$tag does not match Cargo.toml version $version"
            exit 1
          fi
          echo "Publishing version $version from tag v$tag"

      - name: Test
        run: cargo test --locked --all-targets

      - name: Verify crate package
        run: cargo publish --dry-run --locked

      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "::error::set CARGO_REGISTRY_TOKEN in the crates-io environment before tagging a release"
            exit 1
          fi
          cargo publish --locked

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
