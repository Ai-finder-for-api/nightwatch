[package]
# The crates.io name "nightwatch" is already taken, so the package is published
# as `nightwatch-ids`; the library and binary are still called `nightwatch`.
name = "nightwatch-ids"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Ai-finder-for-api"]
description = "NIGHTWATCH - passive network threat detection engine (PCAP analysis, declarative rules, SQLite event store)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Ai-finder-for-api/nightwatch"
homepage = "https://github.com/Ai-finder-for-api/nightwatch"
documentation = "https://docs.rs/nightwatch-ids"
keywords = ["security", "ids", "network", "pcap", "detection"]
categories = ["network-programming", "command-line-utilities"]
build = "build.rs"
include = [
    "/src/**",
    "/tests/**",
    "/rules/**",
    "/fixtures/**",
    "/vendor/qs_crypt/include/**",
    "/vendor/qs_crypt/src/**",
    "/vendor/qs_crypt/README.nightwatch.md",
    "/build.rs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[lib]
name = "nightwatch"
path = "src/lib.rs"

[[bin]]
name = "nightwatch"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]

[profile.release]
opt-level = 3
