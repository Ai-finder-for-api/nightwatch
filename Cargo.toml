[package]
name = "nightwatch"
version = "0.1.0"
edition = "2021"
description = "NIGHTWATCH - passive network threat detection engine"
license = "MIT"

[lib]
name = "nightwatch"
path = "src/lib.rs"

[[bin]]
name = "nightwatch"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]

[profile.release]
opt-level = 3

[build-dependencies]
cc = "1"
