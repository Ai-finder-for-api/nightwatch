[package]
name = "nightwatch-ndr"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Passive network threat detection engine with offline PCAP analysis, declarative rules, and SQLite event storage"
license = "MIT OR Apache-2.0"
authors = ["Ai-finder-for-api and NIGHTWATCH contributors"]
repository = "https://github.com/Ai-finder-for-api/nightwatch"
homepage = "https://crates.io/crates/nightwatch-ndr"
documentation = "https://docs.rs/nightwatch-ndr"
readme = "README.md"
keywords = ["pcap", "network-security", "ids", "detection", "rust"]
categories = ["command-line-utilities", "network-programming"]
build = "build.rs"
include = [
  "/build.rs",
  "/Cargo.lock",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
  "/NOTICE",
  "/PUBLISHING.md",
  "/README.md",
  "/THIRD_PARTY_NOTICES.md",
  "/fixtures/**",
  "/rules/**",
  "/src/**",
  "/tests/**",
  "/vendor/qs_crypt/**",
]

[lib]
name = "nightwatch_ndr"
path = "src/lib.rs"

[[bin]]
name = "nightwatch"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]

[profile.release]
opt-level = 3
